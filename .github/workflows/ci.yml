# CI/CD Pipeline configuration  
name: CI/CD Pipeline

# This condition defines when the workflow should run
on:
  push:
    branches: [ main ] # Triggers when you push to the main branch
  pull_request:
    branches: [ main ] # Triggers when you send a pull request to the main branch

# Global permissions for the workflow
permissions:
  contents: write
  packages: write

# List of jobs to be completed
jobs:
  # Job to Build the Java Application
  App-Build:
    runs-on: ubuntu-latest  # Specifies the type of runner (Latest Version of Ubuntu)
    permissions:
      contents: read  # Minimal permissions required for this job

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # Checks out the repo code

      - name: Set up JDK 21 # Step for setting up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # JDK version
          distribution: 'corretto' # JDK distribution (Amazon Corretto build of OpenJDK)

      - name: Build with Maven # Step for building the project using Maven
        run: mvn -B package --file pom.xml

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-JAR
          path: target/Calculator-1.0-SNAPSHOT.jar  # Upload the JAR file as an artifact

  # Defining the Java App Unit Test Job
  App-Tests:
    needs: App-Build  # Says that the test job needs the App-Build job
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Specifies the OS matrix for testing our app
      fail-fast: false # If this flag is set to true, it cancels all running jobs if any job fails
    runs-on: ${{ matrix.os }} # Dynamically select the runner based on the matrix of OS's mentioned

    steps:
      - uses: actions/checkout@v4 # Checks out the repo

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # JDK Version
          distribution: 'corretto' # JDK distribution (Amazon Corretto build of OpenJDK)

      - name: Test with Maven # Step for running the unit tests using Maven
        run: mvn -B test --file pom.xml

  # Job to build the Docker image
  Docker-Build:
    needs: App-Tests  # Depends on the App-Tests job
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3  # Sets up Docker Buildx for building multi-platform images

      - name: Login to GitHub Container Registry # Logs in to GHCR to allow pushing images
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Use Workflow's GitHub Token for Authorization

      - name: Set Short SHA Version
        run: echo "SHA_VER=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV  # Generates a short SHA version for automatically tagging the container image on GHCR

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true # Enables image pushing after build
          tags: | # Tags the image with 'latest' and SHA version
            ghcr.io/${{ github.repository }}/calculator:latest
            ghcr.io/${{ github.repository }}/calculator:${{ env.SHA_VER }} 
  
  # Job to test the Docker container
  Docker-Tests:
     needs: Docker-Build  # Depends on the Docker-Build job
     runs-on: ubuntu-latest
     permissions:
       packages: write
       contents: read
        
     steps:
       - name: Checkout Code
         uses: actions/checkout@v4
        
       - name: Login to GitHub Container Registry # Logs in to GHCR for pulling image
         uses: docker/login-action@v3
         with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

       - name: Pull Docker image
         run: docker pull ghcr.io/${{ github.repository }}/calculator:latest  # Pull the latest Docker image for testing

       - name: Run Container Tests # Runs tests on the Docker container to make sure it meets expectations
         uses: docker://gcr.io/gcp-runtimes/container-structure-test:latest
         with:
           args: test --image ghcr.io/${{ github.repository }}/calculator:latest --config container-structure-test.yml
           draft: false
           prerelease: false
         env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use Workflow's GitHub Token for Authorization    

  Release:
    needs: Docker-Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Download built artifact # Download the JAR file artifact which were built
        uses: actions/download-artifact@v4
        with:
          name: Calculator-JAR
          path: target/

      - name: Extract Short SHA Version
        run: echo "VERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Create GitHub Release # Create a GitHub Release with the built JAR file using the short SHA version
        uses: softprops/action-gh-release@v1
        with:
          files: ./target/Calculator-1.0-SNAPSHOT.jar
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use Workflow's GitHub Token for Authorization
