name: CD Pipeline

# Only trigger, when the CI workflow succeeded
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
      
# Grant the workflow permission to write contents (Our Release Artifacts)
permissions:
    contents: write      

jobs:
  # Define the build job
  Build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  # Check out the repository code

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'  # Use AdoptOpenJDK distribution

    - name: Build with Maven
      run: mvn -B package --file pom.xml  # Build the project with Maven

    - name: Upload built artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-JAR
        path: target/Calculator-1.0-SNAPSHOT.jar  # Upload the JAR file as an artifact

  # Define the test job
  Test:
    needs: Build  # Test job needs to run after build job
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4  # Check out the repository code

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'

    - name: Test with Maven
      run: mvn -B test --file pom.xml  # Run tests with Maven

  # Define the release job
  Release:
    needs: [Build, Test]  # Release job needs to run after build and test jobs
    runs-on: ubuntu-latest
    
    # Run only if previous jobs were successful
    if: success()  

    steps:
    - uses: actions/checkout@v4  # Check out the repository code

    - name: Download built artifact
      uses: actions/download-artifact@v4
      with:
        name: Calculator-JAR
        path: target/  # Download the JAR file artifact which were built

    - name: Extract SHA Version
      run: echo "VERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./target/Calculator-1.0-SNAPSHOT.jar
        tag_name: ${{ env.VERSION }}
        name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false  # Create a GitHub Release with the built JAR file
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Use Workflow's GitHub Token for Authorization      